name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended
      - run: dotnet build BlutTruck.sln -c Release
      - uses: github/codeql-action/analyze@v3

  secrets:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --verbose

  dependencies:
    name: NuGet vulnerabilities (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Fail on vulnerable packages
        run: |
          dotnet restore BlutTruck.sln
          dotnet list BlutTruck.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then echo "Vulnerable packages found"; exit 1; fi

  container:
    name: Trivy (imagen Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bluttruck-api:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bluttruck-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
